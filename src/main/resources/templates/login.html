<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in — EST time converter</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main style="max-width: 380px; padding-top: 4rem;">
    <h1>EST time converter</h1>
    <p class="subtitle">Sign in to continue.</p>

    <section>
        <div class="flash error" th:if="${param.error}">Wrong username or password.</div>
        <div class="flash success" th:if="${param.logout}">You've been logged out.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <button type="submit">Log in</button>
        </form>
    </section>
</main>
</body>
</html>
