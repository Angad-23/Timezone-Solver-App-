<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login-LessonCraft</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth">
<main class="auth-main">
    <div class="auth-logo"><img th:src="@{/logo.png}" alt="Logo"></div>
    <h1>EST time converter</h1>
    <p class="subtitle">Sign in to continue.</p>

    <section>
        <div class="flash error" th:if="${param.error}">Wrong username or password.</div>
        <div class="flash success" th:if="${param.logout}">You've been logged out.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <button type="submit" style="width: 100%;">Log in</button>
        </form>
    </section>
</main>
</body>
</html>
