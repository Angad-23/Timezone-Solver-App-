spring.application.name=est-time-converter
server.port=8080

# Personal-use app: keep Thymeleaf caching off is only needed in dev.
spring.thymeleaf.cache=true

# Where the roster (learners/tutors) is saved between restarts.
app.roster-file=data/roster.json

# Roster imports can be small spreadsheets; raise the default 1MB limit a bit.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Login credentials for this personal app. Override with real values via
# environment variables (APP_USERNAME / APP_PASSWORD) wherever you deploy ?
# do not rely on the fallback defaults below outside of local testing.
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:changeme}

app.security.username2=${APP_USERNAME2:}
app.security.password2=${APP_PASSWORD2:}